name: Digest quotidien

on:
  schedule:
    - cron: "0 11 * * *"   # 7 h à New York en heure d'été, 6 h en heure d'hiver
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python veille.py --no-open
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp digests/$(date +%F).html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
