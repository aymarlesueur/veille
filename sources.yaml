# Tes sources. Modifie librement les notes : ce sont TES critères.
#
# fiabilite   : 1 à 10. Notes de départ proposées par Claude, à ajuster.
# orientation : gauche | centre-gauche | centre | centre-droit | droite
#               (sert à mesurer la diversité des sources qui confirment un fait)
# type        : media | agence | officiel | specialise
# rubrique    : france | international | eglise | eco | tech
#               (rubrique par défaut des articles de ce flux)
# media       : (optionnel) titre de presse commun à plusieurs flux, pour ne pas compter
#               Le Monde International + Le Monde Économie comme deux sources indépendantes
# langue      : fr | en  (deux articles de langues différentes ne sont pas encore regroupés)

sources:
  # ── Actualité française ─────────────────────────────────────────
  - {nom: Le Monde,        rss: "https://www.lemonde.fr/rss/une.xml",                                    fiabilite: 8, orientation: centre-gauche, type: media, rubrique: france, langue: fr}
  - {nom: Le Figaro,       rss: "https://www.lefigaro.fr/rss/figaro_actualites.xml",                     fiabilite: 7, orientation: droite,        type: media, rubrique: france, langue: fr}
  - {nom: Franceinfo,      rss: "https://www.francetvinfo.fr/titres.rss",                                fiabilite: 8, orientation: centre,        type: media, rubrique: france, langue: fr}
  - {nom: Libération,      rss: "https://www.liberation.fr/arc/outboundfeeds/rss-all/?outputType=xml",   fiabilite: 7, orientation: gauche,        type: media, rubrique: france, langue: fr}
  - {nom: La Croix,        rss: "https://www.la-croix.com/RSS",                                          fiabilite: 8, orientation: centre,        type: media, rubrique: france, langue: fr}
