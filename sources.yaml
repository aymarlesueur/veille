# Réglages du digest
reglages:
  fenetre_heures: 30          # on ne garde que les articles des dernières X heures
  seuil_similarite: 0.31      # 0 à 1 : plus haut = regroupements plus stricts
  max_sujets_par_rubrique: 6  # sujets recoupés affichés par rubrique
  max_non_recoupes: 3         # sujets d'une seule source affichés par rubrique
  fiabilite_min_non_recoupe: 8  # une info non recoupée n'apparaît que si sa source a au moins cette note
  mots_exclus: [horoscope, people, "jeu concours", "bon plan", "code promo", "black friday", "prime video", netflix]
