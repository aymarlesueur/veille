  - {nom: MIT Technology Review, rss: "https://www.technologyreview.com/feed/",     fiabilite: 8, orientation: centre,        type: specialise, rubrique: tech, langue: en}
  - {nom: TechCrunch,      rss: "https://techcrunch.com/feed/",                    fiabilite: 7, orientation: centre,        type: specialise, rubrique: tech, langue: en}
